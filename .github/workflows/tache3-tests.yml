name: Tache 3 - Tests
on:
  push:
    branches: [tache3]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests Maven
        id: tests
        run: mvn -B -pl tika-core -am test
      - name: Rickroll
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/rickroll
